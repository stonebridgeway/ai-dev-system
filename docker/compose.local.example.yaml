# Copy to compose.local.yaml and edit. That file is Git-ignored: it holds local paths.
services:
  ai-dev-mcp:
    volumes:
      # The projects at their own path, so the path an agent names is the path
      # the server opens; on Windows, /workspace.
      - type: bind
        source: ${AI_DEV_PROJECT_PATH:?Set AI_DEV_PROJECT_PATH to a local project or projects directory}
        target: ${AI_DEV_PROJECT_PATH}

      # Dense search with the local BGE-M3 model.
      #
      # The weights are never in the image — they are yours, not the
      # distribution's. Put them in the data volume once, with the network that
      # one run needs:
      #   docker run --rm -it --network bridge --mount type=volume,source=ai-dev-system-data,target=/data <image> ai-dev model install
      # (about 600 MB, the documents embedded with it). Or keep them on the host
      # and mount the folder above bge-m3-onnx/ here, read-only, as 2.x did:
      # uncomment the four lines below and point AI_DEV_MODEL_PATH at
      # ~/.ai-dev/models — the folder above it, not the model directory itself.
      # If bge-m3-onnx there is a link to another disk, mount the link itself
      # at /models/bge-m3-onnx instead: in the container a link inside the
      # mounted folder leads nowhere.
      # The launchers (docker/run-mcp.sh, run-mcp.ps1 and the Windows Claude
      # proxy ClaudeMcpProxy.cs) and the 3.0 client entry mount the same
      # variable the same way; scripts/model-mount-contract.test.mjs holds them
      # to it.
      # - type: bind
      #   source: ${AI_DEV_MODEL_PATH:?Set AI_DEV_MODEL_PATH to the folder holding bge-m3-onnx/}
      #   target: /models
      #   read_only: true
