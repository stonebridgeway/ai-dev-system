name: Dense search evaluation

# Dense search on the real weights, measured where they can be fetched: the
# model comes from huggingface.co, which runners can reach.
#
# 3.0 runs dense search on the ONNX export alone; the Python backend it was
# once compared with is gone. That
# comparison — int8 against fp32 — can still be taken on
# the 2.x line, whose copy of this workflow keeps both jobs. If int8 ever loses
# by more than noise, the manifest's `dtype` moves to fp16 or fp32: a field,
# not a code change.
#
# Dispatch only. It downloads about 600 MB, so it is not something every push
# should pay for.

on:
  workflow_dispatch:
    inputs:
      max_cases:
        description: Golden cases to run (45 exist; anything larger scores all of them)
        required: false
        default: "50"

permissions:
  contents: read

concurrency:
  group: dense-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  onnx:
    name: ONNX backend (no Python)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ai-dev-mcp-server/package-lock.json

      - name: Read the pinned revision
        id: manifest
        run: |
          revision="$(node -p "require('./ai-dev-mcp-server/models/bge-m3.manifest.json').revision")"
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"

      # Keyed on the revision, so a manifest that moves to a new export or a new
      # dtype downloads afresh rather than scoring yesterday's weights.
      - name: Restore the model
        uses: actions/cache@v4
        with:
          path: ~/.ai-dev/models/bge-m3-onnx
          key: bge-m3-onnx-${{ steps.manifest.outputs.revision }}

      - name: Install dependencies
        working-directory: ai-dev-mcp-server
        run: npm ci --no-audit --no-fund

      # No dependency install scripts ran: the package's .npmrc turns them off,
      # and the Dockerfile passes --ignore-scripts.
      # onnxruntime-node ships its prebuilt binaries inside the npm package, so
      # that must not break it; if that ever changes, this is where it is caught
      # rather than in a user's first search.
      - name: The native binding works without install scripts
        working-directory: ai-dev-mcp-server
        run: node -e "import('onnxruntime-node').then((m) => { if (!m.InferenceSession) { throw new Error('onnxruntime-node loaded without InferenceSession'); } console.log('onnxruntime-node loaded'); })"

      # Criterion (1): one command, one Node, no Python. The download verifies
      # every file against the manifest's sha256 and throws on a mismatch, so an
      # export that moved upstream fails this step loudly instead of quietly
      # rewriting what we are pinned to.
      - name: Download the model and build the dense index
        working-directory: ai-dev-mcp-server
        env:
          AI_DEV_DENSE_BACKEND: onnx
        run: npm run setup -- --model --no-health

      - name: Dense search is READY
        working-directory: ai-dev-mcp-server
        run: npm run dense:doctor

      # The gated inference test: width, norm, and that a translation pair is
      # closer than two unrelated sentences. It skips everywhere else.
      - name: Inference test
        working-directory: ai-dev-mcp-server
        run: node --import ./test/setup.mjs --test src/core/dense-onnx-inference.test.mjs

      - name: Measure
        working-directory: ai-dev-mcp-server
        env:
          AI_DEV_DENSE_BACKEND: onnx
        run: node scripts/dense-benchmark.mjs --label onnx --max-cases "${{ inputs.max_cases }}" --out "${{ runner.temp }}/dense-onnx.json"

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: dense-eval-onnx
          path: ${{ runner.temp }}/dense-onnx.json

      - name: Write the summary
        if: always()
        run: |
          node - "${{ runner.temp }}/dense-onnx.json" <<'JS' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          let report = null;
          try {
            report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          } catch {
            console.log("_The measurement did not produce a report; the steps above say why._");
            process.exit(0);
          }
          const rows = [
            ["Revision", String(report.revision).slice(0, 12)],
            ["dtype", report.dtype],
            ["Documents embedded", `${report.index.dense_documents} (${report.index.dense_pending_documents} pending)`],
            ["Mean reciprocal rank", report.eval.mean_reciprocal_rank],
            ["Top-1 accuracy", report.eval.top_1_accuracy],
            ["Mean nDCG", report.eval.mean_ndcg],
            ["Golden cases passed", `${report.eval.passed}/${report.eval.total}`],
            ["Cold start (ms)", report.latency_ms.cold_start],
            ["Warm query, median (ms)", report.latency_ms.warm_median],
            ["Resident memory (MB)", report.memory_mb.rss]
          ];
          console.log("## Dense search on the pinned ONNX export\n");
          console.log("| | ONNX |");
          console.log("| --- | --- |");
          for (const [label, value] of rows) console.log(`| ${label} | ${value} |`);
          JS
