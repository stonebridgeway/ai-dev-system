name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-server:
    name: MCP server (lint, security, unit)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ai-dev-mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: ai-dev-mcp-server
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Static quality gate
        working-directory: ai-dev-mcp-server
        run: npm run lint

      - name: Security gate
        working-directory: ai-dev-mcp-server
        run: npm run security

      - name: Packaging manifest check
        working-directory: ai-dev-mcp-server
        run: npm run packaging:check

      # The full tool surface is coupled to the vault layout (03-skills-catalog,
      # 01-system, ...). A standalone checkout can only exercise the vault-free
      # src/core modules; the vault-coupled suite, coverage gate, and the
      # protocol / lifecycle smokes run from the docker-publish workflow and
      # from a full vault checkout.
      - name: Core unit tests
        working-directory: ai-dev-mcp-server
        run: npm run test:core
