name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-server:
    name: MCP server (lint, security, unit)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ai-dev-mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: ai-dev-mcp-server
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Static quality gate
        working-directory: ai-dev-mcp-server
        run: npm run lint

      - name: Security gate
        working-directory: ai-dev-mcp-server
        run: npm run security

      - name: Packaging manifest check
        working-directory: ai-dev-mcp-server
        run: npm run packaging:check

      - name: Core unit tests
        working-directory: ai-dev-mcp-server
        run: npm run test:core

  vault-suite:
    name: MCP server (vault-coupled suite + smokes)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ai-dev-mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: ai-dev-mcp-server
        run: npm ci --ignore-scripts --no-audit --no-fund

      # A standalone checkout has no full Obsidian vault, so the server resolves
      # its content root to the bundled docker/public-seed tree. That seed ships
      # skill sources only; build its registry / taxonomy so the vault-coupled
      # tool surface can route skills.
      - name: Build the bundled seed skill registry
        working-directory: ai-dev-mcp-server
        run: npm run skills:ensure-index

      - name: Vault-coupled unit tests
        working-directory: ai-dev-mcp-server
        run: npm test

      - name: MCP protocol smoke
        working-directory: ai-dev-mcp-server
        run: npm run protocol:smoke

      - name: Task lifecycle smoke
        working-directory: ai-dev-mcp-server
        run: npm run lifecycle:smoke
